<h1>🔥 A friend challenged you on Warmer</h1>
<p>Warmer is a word game where you guess by meaning and get warmer or colder.</p>
<a id="play" href="https://play.google.com/store/apps/details?id=com.warmer.app">Get Warmer on Google Play</a>
<script>
// carry the challenge through the install: Play hands "referrer" to the app on first launch
var q = location.search.replace(/^\?/, "");
if (q) document.getElementById("play").href += "&referrer=" + encodeURIComponent(q);
</script>
